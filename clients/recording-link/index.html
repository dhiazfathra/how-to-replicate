<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to Replicate — Recording Link</title>
  </head>
  <body>
    <main>
      <h1>Record a bug report</h1>
      <p id="disclosure">
        This page records your screen locally, in your browser. Nothing is uploaded — the
        recording never leaves this device except when you click Download.
      </p>
      <button id="start" type="button">Start recording</button>
      <button id="stop" type="button" disabled>Stop recording</button>
      <p id="status" role="status"></p>
      <a id="download" download="capture.htr" hidden>Download .htr bundle</a>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
